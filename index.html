<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7d8f78" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<title>写真から文字 / Photo to Text</title></head>
<body>
<header class="top"><h1 data-t="app"></h1>
  <div class="switches"><button id="big" class="chip" aria-pressed="false" data-t="big"></button><button id="lang" class="chip">English</button></div></header>
<main>
  <p class="lead" data-t="lead"></p>
  <div class="row">
    <label class="btn primary"><span data-t="take"></span><input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn"><span data-t="pick"></span><input id="pick" type="file" accept="image/*" hidden></label>
  </div>
  <section id="edit" hidden>
    <p class="small" data-t="cropHint"></p>
    <div class="stage"><canvas id="cv"></canvas><div id="box" hidden></div></div>
    <div class="row"><button class="btn" id="rotL">⟲</button><button class="btn" id="rotR">⟳</button><button class="btn" id="reset" data-t="reset"></button></div>
    <div class="row modes">
      <span data-t="mode"></span>
      <button class="chip m" data-m="ai" aria-pressed="false" data-t="mAi"></button>
      <button class="chip m" data-m="ocr" aria-pressed="true" data-t="mOcr"></button>
    </div>
    <button class="btn primary wide" id="read" data-t="read"></button>
    <div id="status" class="small"></div>
  </section>
  <section id="out" hidden>
    <textarea id="txt" rows="10"></textarea>
    <div class="row"><button class="btn" id="copy" data-t="copy"></button><button class="btn" id="share" data-t="share"></button><button class="btn" id="save" data-t="save"></button></div>
  </section>
  <p class="note" data-t="note"></p>
</main>
<script type="module" src="/src/main.ts"></script>
</body></html>
